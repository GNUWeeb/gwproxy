name: CI

on:
  # Trigger the workflow on push or pull requests.
  push:
  pull_request:


jobs:
  get_commit_list:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each commit becomes 14 build jobs, and a matrix may hold 256 jobs
      # at most. A push of more commits (a rewritten history, say) would
      # fail before testing anything, so test only its newest 18 commits.
      - name: Get commit list
        id: get_commit_list
        run: |
          git config core.abbrev 12;
          ( \
            ( \
              git log --pretty="%h" --reverse ${{github.event.commits[0].id}}^...${{github.sha}} || \
              (printf "%s" ${{github.sha}} | head -c 12) \
            ) | tail -n 18 | awk '{ print "id" NR "=" $1 }' \
          ) > $GITHUB_OUTPUT;
          echo "List of tested commits:" > $GITHUB_STEP_SUMMARY;
          cat $GITHUB_OUTPUT >> $GITHUB_STEP_SUMMARY;

    outputs:
      commit_list: ${{ toJson(steps.*.outputs.*) }}


  build:
    needs: get_commit_list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJson(needs.get_commit_list.outputs.commit_list) }}
        build_args:
          # x86-64 gcc
          - arch: x86_64
            cc_pkg: gcc-x86-64-linux-gnu
            cc: x86_64-linux-gnu-gcc
            sanitize: 0

          # x86-64 gcc asan
          - arch: x86_64
            cc_pkg: gcc-x86-64-linux-gnu
            cc: x86_64-linux-gnu-gcc
            sanitize: 1

          # x86-64 clang asan
          - arch: x86_64
            cc_pkg: clang
            cc: clang
            sanitize: 1

          # x86-64 clang
          - arch: x86_64
            cc_pkg: clang
            cc: clang
            sanitize: 0

          # x86 (32-bit) gcc
          - arch: i686
            cc_pkg: gcc-i686-linux-gnu
            cc: i686-linux-gnu-gcc
            sanitize: 0

          # aarch64 gcc
          - arch: aarch64
            cc_pkg: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            sanitize: 0

          # arm (32-bit) gcc
          - arch: arm
            cc_pkg: gcc-arm-linux-gnueabi
            cc: arm-linux-gnueabi-gcc
            sanitize: 0

          # riscv64
          - arch: riscv64
            cc_pkg: gcc-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc
            sanitize: 0

          # powerpc64
          - arch: powerpc64
            cc_pkg: gcc-powerpc64-linux-gnu
            cc: powerpc64-linux-gnu-gcc
            sanitize: 0

          # powerpc
          - arch: powerpc
            cc_pkg: gcc-powerpc-linux-gnu
            cc: powerpc-linux-gnu-gcc
            sanitize: 0

          # alpha
          - arch: alpha
            cc_pkg: gcc-alpha-linux-gnu
            cc: alpha-linux-gnu-gcc
            sanitize: 0

          # mips64
          - arch: mips64
            cc_pkg: gcc-mips64-linux-gnuabi64
            cc: mips64-linux-gnuabi64-gcc
            sanitize: 0

          # mips
          - arch: mips
            cc_pkg: gcc-mips-linux-gnu
            cc: mips-linux-gnu-gcc
            sanitize: 0

          # hppa
          - arch: hppa
            cc_pkg: gcc-hppa-linux-gnu
            cc: hppa-linux-gnu-gcc
            sanitize: 0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout commit
        run: |
          git checkout ${{ matrix.commit }};

      - name: Install compilers
        run: |
          ./.github/scripts/ci.sh deps \
            --arch=${{matrix.build_args.arch}} \
            --cc=${{matrix.build_args.cc}} \
            --cc-pkg=${{matrix.build_args.cc_pkg}};

      - name: Build
        run: |
          ./.github/scripts/ci.sh build \
            --arch=${{matrix.build_args.arch}} \
            --cc=${{matrix.build_args.cc}} \
            --sanitize=${{matrix.build_args.sanitize}};

      # A failing test prints only "FAIL <name> (rc=N)" and "logs in
      # .test-out"; everything it actually captured stays in the workspace and
      # dies with the runner. Keep it. config.make comes along because a row
      # runs several build variants and .test-out does not record which one it
      # belongs to -- its "Configured with" line does.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{matrix.build_args.arch}}-${{matrix.build_args.cc}}-san${{matrix.build_args.sanitize}}-${{matrix.commit}}
          path: |
            .test-out/
            config.make
            config.h
          # .test-out is a dot directory and upload-artifact skips hidden
          # paths unless told otherwise. Without this the step still goes
          # green, on an artifact holding only the two config files.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  alpine-musl-build:
    needs: get_commit_list
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        commit: ${{ fromJson(needs.get_commit_list.outputs.commit_list) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout commit
        run: |
          git checkout ${{ matrix.commit }};

      - name: Setup Alpine Environment
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.15

      - name: Display Alpine version
        shell: alpine.sh {0}
        run: cat /etc/alpine-release;

      - name: Install build dependencies
        shell: alpine.sh --root {0}
        run: |
          # Bootstrap only: bash is what runs the CI script, the script
          # installs the actual build dependencies so that the package list
          # travels with the commit under test.
          apk add --no-cache bash;
          ./.github/scripts/ci.sh alpine-deps;

      - name: Build
        shell: alpine.sh {0}
        run: |
          ./.github/scripts/ci.sh alpine-build;

      # This job runs the suite too, so it loses the same evidence. Uploaded
      # from the host rather than the chroot -- the workspace is shared.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-alpine-${{matrix.commit}}
          path: |
            .test-out/
            config.make
            config.h
          # .test-out is a dot directory and upload-artifact skips hidden
          # paths unless told otherwise. Without this the step still goes
          # green, on an artifact holding only the two config files.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  codespell:
    needs: get_commit_list
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        commit: ${{ fromJson(needs.get_commit_list.outputs.commit_list) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout commit
        run: |
          git checkout ${{ matrix.commit }};

      - name: Install codespell
        run: |
          ./.github/scripts/ci.sh codespell-deps;

      - name: Execute codespell
        run: |
          ./.github/scripts/ci.sh codespell;
